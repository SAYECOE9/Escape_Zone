<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape_Zone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <div class="top">

            <div class="logo">
                ESCAPE_ZONE
            </div>

            <div class="stats">
                <span>❤️ <b id="health">100</b></span>
                <span>🪙 <b id="coins">0</b></span>
                <span>LEVEL <b id="level">1</b></span>
                <span>SCORE <b id="score">0</b></span>
            </div>

        </div>

        <canvas id="canvas"></canvas>

        <div class="mission">
            <span id="missionKey">🔑 FIND KEY</span>
            <span id="missionCoins">🪙 COLLECT 3 COINS</span>
            <span id="missionSwitch">⚡ ACTIVATE SWITCH</span>
            <span id="missionExit">🚪 ESCAPE</span>
        </div>



        <div class="screen" id="screen">

            <div class="box">

                <h1 id="title">
                    ESCAPE ZONE
                </h1>

                <p id="text">
                    Complete every mission and escape the zone.
                    Watch out for the enemy.
                </p>

                <button id="start">
                    START GAME
                </button>

            </div>

        </div>


    </div>
<script src="nod.js"></script>
</body>

</html>
